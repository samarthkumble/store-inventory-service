# Runs on every push and pull request. A red X on GitHub means something broke.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres for the tests, same version as docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@localhost:5432/inventory
      TEST_DATABASE_URL: postgresql+psycopg://inventory:inventory@localhost:5432/inventory_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                      # reuse downloads between runs
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests with coverage (fails below 90%)
        run: pytest --cov --cov-report=term --cov-fail-under=90

  docker:
    # Only build the image once the tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        # --wait blocks until both healthchecks pass (or fails the job).
        run: docker compose up -d --build --wait

      - name: Smoke test the running API
        run: |
          curl --fail --silent http://localhost:8000/health
          docker compose exec -T api python -m scripts.seed
          curl --fail --silent "http://localhost:8000/stores/1/products?q=tap"

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
