# One command runs everything:  docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: inventory-api
    environment:
      # "db", not "localhost": inside a container, localhost is the container
      # itself. Compose gives each service a DNS name on a shared network.
      DATABASE_URL: postgresql+psycopg://inventory:inventory@db:5432/inventory
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Wait until Postgres actually accepts connections, not just "started".
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
